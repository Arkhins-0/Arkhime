name: Publish Release

# Push a tag like v1.0.0 (or v1.1.0-beta1 for a pre-release) to build the signed APKs and publish
# them as a GitHub release. The app's updater reads these releases and offers the update in-app.
on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: ${{ github.repository == 'Arkhins-0/Arkhime' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: v1-${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            v1-${{ runner.os }}-gradle-

      - name: Decode Keystore File
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > $GITHUB_WORKSPACE/key.keystore

      - name: Build signed release APKs
        working-directory: android
        env:
          TAG: ${{ github.ref_name }}
        run: |
          chmod +x ./gradlew
          VERSION="${TAG#v}"
          ./gradlew assembleGoogleRelease \
            -PappVersion="${VERSION%%-*}" \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/key.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Name the APKs after the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for apk in android/app/build/outputs/apk/google/release/*.apk; do
            abi=$(basename "$apk" .apk | sed -e 's/^app-google-//' -e 's/-release$//')
            cp "$apk" "dist/Arkhime-${TAG}-${abi}.apk"
          done
          ls -l dist

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A tag with a dash (v1.1.0-beta1) becomes a pre-release, which only beta builds follow
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease" ;; esac
          gh release create "$TAG" dist/*.apk --title "Arkhime $TAG" --generate-notes $PRE
