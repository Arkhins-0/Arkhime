name: Publish Beta

# Push a tag like beta-v1.2.0 to build the Beta app (package com.arkhins.arkhime.beta, "Arkhime β") and publish it
# as a GitHub pre-release. Beta installs update themselves from these pre-releases only; the release app never sees
# them (it follows full v… releases, see release.yml). Alpha is built and installed from the PC and never published.
on:
  push:
    tags:
      - "beta-v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta:
    if: ${{ github.repository == 'Arkhins-0/Arkhime' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: v1-${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            v1-${{ runner.os }}-gradle-

      - name: Decode Keystore File
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > $GITHUB_WORKSPACE/key.keystore

      - name: Build signed beta APKs
        working-directory: android
        env:
          TAG: ${{ github.ref_name }}
        run: |
          chmod +x ./gradlew
          VERSION="${TAG#beta-v}"
          ./gradlew assembleGoogleBeta \
            -PappVersion="${VERSION%%-*}" \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/key.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Name the APKs after the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for apk in android/app/build/outputs/apk/google/beta/*.apk; do
            abi=$(basename "$apk" .apk | sed -e 's/^app-google-//' -e 's/-beta$//')
            cp "$apk" "dist/Arkhime-Beta-${TAG#beta-}-${abi}.apk"
          done
          ls -l dist

      - name: Changes since the last beta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PREV=$(git tag --list 'beta-v*' --sort=-creatordate | grep -vx "$TAG" | head -1)
          { echo "## Changes"; git log --no-merges --format='- %s' --max-count=40 ${PREV:+$PREV..}"$TAG"; } > NOTES.md
          cat NOTES.md
          # The same list for notify.sh (Telegram): one line, newlines escaped
          FORMAT="● %s ~%an [֍](https://github.com/${{ github.repository }}/commit/%H)"
          LOG=$(git log --no-merges --pretty=format:"$FORMAT" --max-count=20 ${PREV:+$PREV..}"$TAG")
          LOG="${LOG//'%'/'%25'}"
          LOG="${LOG//$'\n'/'%0A'}"
          echo "COMMIT_LOG=${LOG}" >> $GITHUB_ENV

      - name: Publish the beta pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.apk --title "Arkhime Beta ${TAG#beta-}" --notes-file NOTES.md --prerelease

      - name: Post the APK to Telegram
        # Telegram is optional: a failed post must not fail the beta
        continue-on-error: true
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          APK_PATH=$(ls dist/*universal*.apk | head -1)
          CHECKSUM=$(sha256sum "$APK_PATH" | awk '{print $1}')
          export APK_PATH CHECKSUM
          chmod +x workflowscripts/notify.sh
          ./workflowscripts/notify.sh
